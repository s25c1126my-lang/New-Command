name: test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12.3'

      - name: Check environment
        run: |
          python3 --version
          cat /etc/os-release

      - name: Run tests
        run: bash test.bash

